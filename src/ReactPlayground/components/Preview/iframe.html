<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview</title>
    <script>
        window.addEventListener('error', (e) => {
            window.parent.postMessage({
                type: 'ERROR',
                message: e.message
            })
        })
    </script>

</head>

<body>
    <script type="importmap"></script>
    <script type="module" id="appSrc"></script>
    <div id="root"></div>

    <!-- 添加接收更新的脚本 -->
    <script>
        // 如果这是在新标签页中打开的预览页面，设置BroadcastChannel监听更新
        if (window.opener && !window.frameElement) {
            try {
                const channel = new BroadcastChannel('react-playground-updates');
                channel.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'CODE_UPDATE') {
                        // 接收到更新，更新页面内容
                        const scriptElements = document.querySelectorAll('script');

                        // 更新importmap
                        const importMapScript = document.querySelector('script[type="importmap"]');
                        if (importMapScript && event.data.importMap) {
                            importMapScript.textContent = event.data.importMap;
                        }

                        // 更新应用代码
                        const appScript = document.getElementById('appSrc');
                        if (appScript && event.data.compiledCode) {
                            appScript.textContent = event.data.compiledCode;

                            // 重新执行脚本以应用更新
                            const newScript = document.createElement('script');
                            newScript.id = 'appSrc';
                            newScript.type = 'module';
                            newScript.textContent = event.data.compiledCode;
                            appScript.parentNode.replaceChild(newScript, appScript);
                        }
                    }
                });

                // 存储通道引用以便清理
                window.reactPlaygroundChannel = channel;

                // 页面关闭时清理
                window.addEventListener('beforeunload', () => {
                    if (window.reactPlaygroundChannel) {
                        window.reactPlaygroundChannel.close();
                    }
                });
            } catch (e) {
                console.error('无法设置更新通道', e);
            }
        }
    </script>
</body>

</html>
